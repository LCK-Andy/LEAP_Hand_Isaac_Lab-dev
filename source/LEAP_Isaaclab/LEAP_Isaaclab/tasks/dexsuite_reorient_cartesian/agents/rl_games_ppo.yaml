# Same PPO architecture as the joint-control task, with a distinct action/observation contract.
params:
  seed: 42
  env:
    clip_observations: 100.0
    clip_actions: 1.0
    obs_groups: [policy, proprio, perception, controller]
    concate_obs_groups: true
  algo:
    name: a2c_continuous
  model:
    name: continuous_a2c_logstd
  network:
    name: actor_critic
    separate: true
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -1.8971199848858813  # log(0.15), normalized for all 22 channels
        fixed_sigma: true
    mlp:
      units: [512, 256, 128]
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None
  load_checkpoint: false
  load_path: ''
  config:
    name: dexsuite_reorient_cartesian
    env_name: rlgpu
    device: cuda:0
    device_name: cuda:0
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    value_bootstrap: true
    num_actors: 256
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 0.001
    lr_schedule: adaptive
    schedule_type: standard
    kl_threshold: 0.01
    score_to_win: 100000
    max_epochs: 50000
    save_best_after: 100
    save_frequency: 200
    print_stats: true
    grad_norm: 1.0
    entropy_coef: 0.0
    exploration:
      initial_std: 0.15
      min_std: 0.03
      max_std: 0.3
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 32
    minibatch_size: 1024
    mini_epochs: 5
    critic_coef: 4
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.0005
pbt:
  enabled: false
  policy_idx: 0
  num_policies: 1
  directory: logs/rl_games/dexsuite_reorient_cartesian
  workspace: cartesian_workspace
  objective: dexpbt
  initial_diversity: false
